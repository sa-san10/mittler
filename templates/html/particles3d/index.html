<!doctype html>
<!-- Mittler の HTML のレイヤーのひな形：three.js の光る粒。粒が渦を巻きながら集まって球になり、ゆっくり回って、終わりに外へ散る。足して光る（blend は add か screen が合う）。
     args：count（粒の数。下書きは 1/4）・colors（内側から外側の色 2 つ）・size（粒の大きさ）・radius（球の半径）・orbit（クリップのあいだにカメラが回る角度 度）
     位置は t（クリップの頭からの秒）だけで決める（シェーダーで計算。前のコマを覚えない）。背景は透明 -->
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body>
<script type="module">
import * as THREE from '../vendor/three.module.min.js';
const a0 = mittler.args, W = mittler.W, H = mittler.H;
const N = Math.round((a0.count ?? 9000) * (mittler.draft ? 0.25 : 1));
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
// 粒ごとの決まった値（種で決まる乱数。ページを読むときに 1 回）
const geo = new THREE.BufferGeometry(), dir = new Float32Array(N * 3), rnd = new Float32Array(N * 4);
for (let i = 0; i < N; i++) {
  const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2, r = Math.sqrt(1 - u * u);
  dir.set([r * Math.cos(th), u, r * Math.sin(th)], i * 3);
  rnd.set([Math.random(), Math.random(), Math.random(), Math.random()], i * 4);
}
geo.setAttribute('position', new THREE.BufferAttribute(dir, 3));
geo.setAttribute('rnd', new THREE.BufferAttribute(rnd, 4));
const col = c => new THREE.Color(c);
const mat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uDur: { value: mittler.dur || 5 }, uR: { value: a0.radius ?? 1.6 }, uSize: { value: (a0.size ?? 16) * H / 1080 },
              uC0: { value: col(a0.colors?.[0] ?? '#ffe2a8') }, uC1: { value: col(a0.colors?.[1] ?? '#ff4fa0') } },
  vertexShader: `
    attribute vec4 rnd; uniform float uT, uDur, uR, uSize; varying vec3 vC; varying float vA; uniform vec3 uC0, uC1;
    float ease(float p){ p = clamp(p, 0.0, 1.0); return 1.0 - pow(1.0 - p, 3.0); }
    void main(){
      float gather = ease((uT - rnd.x * 0.6) / 1.6);                 // 集まる（粒ごとに少しずれて）
      float burst = ease((uT - (uDur - 1.2) - rnd.y * 0.3) / 1.2);    // 終わりに散る
      vec3 d = normalize(position);
      float spin = (1.0 - gather) * (3.0 + rnd.z * 4.0) + uT * 0.4;
      mat2 R = mat2(cos(spin), -sin(spin), sin(spin), cos(spin));
      vec3 p = d * uR * (0.85 + 0.3 * rnd.w);
      p.xz = R * p.xz;
      vec3 far = d * (6.0 + rnd.x * 8.0) + vec3(0.0, (rnd.y - 0.5) * 6.0, 0.0);
      p = mix(far, p, gather) + d * burst * (3.0 + rnd.z * 6.0);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize * (0.5 + rnd.w) * (6.0 / -mv.z);
      vC = mix(uC0, uC1, clamp(length(p) / (uR * 1.6), 0.0, 1.0));
      vA = (0.45 + 0.55 * gather) * (1.0 - burst * 0.9) * smoothstep(0.0, 0.4, uT);
    }`,
  fragmentShader: `
    varying vec3 vC; varying float vA;
    void main(){ float r = length(gl_PointCoord - 0.5); float a = (exp(-r * r * 40.0) + 0.35 * exp(-r * r * 9.0)) * vA; gl_FragColor = vec4(vC * a * 1.6, a); }`,
});
scene.add(new THREE.Points(geo, mat));
mittler.onFrame((t, a) => {
  mat.uniforms.uT.value = t;
  const yaw = THREE.MathUtils.degToRad((a.orbit ?? 40) * (t / (mittler.dur || 5) - 0.5));
  camera.position.set(Math.sin(yaw) * 7, 1.2, Math.cos(yaw) * 7); camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
});
</script></body></html>
